name: Build Zink (OSMesa 24.0.5 - Hack Source MoltenVK)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Cài đặt công cụ
        run: |
          brew install meson ninja bison flex pkg-config vulkan-headers
          pip3 install mako packaging --break-system-packages

      - name: Tải MoltenVK 1.4.1
        run: |
          git clone --branch v1.4.1 https://github.com/KhronosGroup/MoltenVK.git

      - name: Tải và giải nén Mesa 24.0.5
        run: |
          curl -O -L https://archive.mesa3d.org/mesa-24.0.5.tar.xz
          tar -xf mesa-24.0.5.tar.xz

      - name: Hack Mã Nguồn Ép iOS Nhận MoltenVK
        run: |
          cd mesa-24.0.5
          # Bới tung code C/C++ đổi tên Vulkan thành MoltenVK kèm @rpath cho iOS
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/libvulkan\.1\.dylib/@rpath\/libMoltenVK.dylib/g' {} +
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's/libvulkan\.dylib/@rpath\/libMoltenVK.dylib/g' {} +

      - name: Tạo cấu hình Build cho iPhone (arm64)
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          cat <<EOF > ios.ini
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          objc = 'clang'
          objcpp = 'clang++'
          ar = 'ar'
          strip = 'strip'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd', '-DVK_USE_PLATFORM_IOS_MVK']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd', '-DVK_USE_PLATFORM_IOS_MVK']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'IOSurface', '-framework', 'UIKit', '-Wl,-rpath,@loader_path']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'IOSurface', '-framework', 'UIKit', '-Wl,-rpath,@loader_path']

          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

      - name: Cấu hình Meson (OSMesa Đúc Nguyên Khối)
        run: |
          cd mesa-24.0.5
          meson setup build_ios \
            --cross-file ../ios.ini \
            -Dbuildtype=release \
            -Dgallium-drivers=zink,swrast \
            -Dvulkan-drivers= \
            -Dmoltenvk-dir=${{ github.workspace }}/MoltenVK/MoltenVK \
            -Dglx=disabled \
            -Degl=disabled \
            -Dplatforms= \
            -Dshared-glapi=disabled \
            -Dosmesa=true \
            -Dllvm=disabled

      - name: Khởi động Ninja (Biên dịch)
        run: |
          cd mesa-24.0.5/build_ios
          ninja

      - name: Xuất file dylib
        uses: actions/upload-artifact@v4
        with:
          name: libOSMesa-iOS-Hacked
          path: mesa-24.0.5/build_ios/src/gallium/targets/osmesa/libOSMesa.*dylib