name: Build Pojav Mesa Full
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install Tools
        run: |
          brew install meson ninja bison flex pkg-config
          pip3 install mako packaging --break-system-packages

      - name: Clone MoltenVK
        run: git clone --branch v1.4.1 https://github.com/KhronosGroup/MoltenVK.git

      - name: Clone PojavLauncher Mesa
        run: git clone --depth 1 https://github.com/PojavLauncher/mesa.git mesa-24.0.5

      - name: Patch Vulkan Path
        run: |
          cd mesa-24.0.5
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's|"libvulkan\.1\.dylib"|"@executable_path/Frameworks/libvulkan.1.dylib"|g' {} +

      - name: Inject Auto-Env
        run: |
          cd mesa-24.0.5
          cat << 'EOF' >> src/gallium/targets/osmesa/osmesa.c
          #include <stdlib.h>
          #include <dlfcn.h>
          #include <string.h>
          __attribute__((constructor))
          void pojaviOS_auto_env() {
              setenv("MVK_CONFIG_FULL_IMAGE_VIEW_SWIZZLE", "1", 1);
              Dl_info info;
              if (dladdr((void*)pojaviOS_auto_env, &info)) {
                  char json_path[1024];
                  strncpy(json_path, info.dli_fname, sizeof(json_path));
                  char *last_slash = strrchr(json_path, '/');
                  if (last_slash) {
                      strcpy(last_slash + 1, "MoltenVK_icd.json");
                      setenv("VK_ICD_FILENAMES", json_path, 1);
                  }
              }
          }
          EOF

      - name: Create ios.ini
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cat <<EOF > ios.ini
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          objc = 'clang'
          objcpp = 'clang++'
          ar = 'ar'
          strip = 'strip'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-Wl,-rpath,@loader_path']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-Wl,-rpath,@loader_path']

          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

      - name: Meson Setup
        run: |
          cd mesa-24.0.5
          meson setup build_ios --cross-file ../ios.ini -Dbuildtype=release -Dgallium-drivers=zink,swrast -Dshared-glapi=enabled -Dosmesa=true -Dllvm=disabled

      - name: Build and Zip
        run: |
          cd mesa-24.0.5
          ninja -C build_ios
          zip -r Mesa_Full_Bundle.zip build_ios/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Pojav-Final-Zip
          path: mesa-24.0.5/Mesa_Full_Bundle.zip