name: Build Zink (libglapi + auto env + fix path)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: install packed
        run: |
          brew install meson ninja bison flex pkg-config vulkan-headers
          pip3 install mako packaging --break-system-packages

      - name: install MoltenVK 1.4.1
        run: |
          git clone --branch v1.4.1 https://github.com/KhronosGroup/MoltenVK.git

      - name: install and unzip Mesa 24.0.5
        run: |
          curl -O -L https://archive.mesa3d.org/mesa-24.0.5.tar.xz
          tar -xf mesa-24.0.5.tar.xz

      - name: 1. patch path Vulkan Loader fully (1 arg)
        run: |
          cd mesa-24.0.5
          find . -type f \( -name "*.c" -o -name "*.cpp" -o -name "*.h" \) -exec sed -i '' 's|"libvulkan\.1\.dylib"|"@executable_path/Frameworks/libvulkan.1.dylib"|g' {} +

      - name: 2. inject code auto-environment to OSMesa
        run: |
          cd mesa-24.0.5
          cat << 'EOF' >> src/gallium/targets/osmesa/osmesa.c

          #include <stdlib.h>
          #include <dlfcn.h>
          #include <string.h>

          __attribute__((constructor))
          void pojaviOS_auto_env() {
              setenv("GALLIUM_DRIVER", "zink", 1);
              setenv("MVK_CONFIG_FULL_IMAGE_VIEW_SWIZZLE", "1", 1);
              
              Dl_info info;
              if (dladdr((void*)pojaviOS_auto_env, &info)) {
                  char json_path[1024];
                  strncpy(json_path, info.dli_fname, sizeof(json_path));
                  char *last_slash = strrchr(json_path, '/');
                  if (last_slash) {
                      strcpy(last_slash + 1, "MoltenVK_icd.json");
                      setenv("VK_ICD_FILENAMES", json_path, 1);
                  }
              }
          }
          EOF

      - name: setting build for iPhone (arm64)
        run: |
          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cat <<EOF > ios.ini
          [binaries]
          c = 'clang'
          cpp = 'clang++'
          objc = 'clang'
          objcpp = 'clang++'
          ar = 'ar'
          strip = 'strip'

          [built-in options]
          c_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd', '-DVK_USE_PLATFORM_IOS_MVK']
          cpp_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-I${{ github.workspace }}/MoltenVK/MoltenVK/icd', '-DVK_USE_PLATFORM_IOS_MVK']
          c_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'IOSurface', '-framework', 'UIKit', '-Wl,-rpath,@loader_path']
          cpp_link_args = ['-arch', 'arm64', '-isysroot', '$IOS_SDK', '-miphoneos-version-min=15.0', '-framework', 'Foundation', '-framework', 'Metal', '-framework', 'IOSurface', '-framework', 'UIKit', '-Wl,-rpath,@loader_path']

          [host_machine]
          system = 'darwin'
          subsystem = 'ios'
          cpu_family = 'aarch64'
          cpu = 'arm64'
          endian = 'little'
          EOF

      - name: setting Meson (libglapi - shared-glapi=disabled)
        run: |
          cd mesa-24.0.5
          meson setup build_ios \
            --cross-file ../ios.ini \
            -Dbuildtype=release \
            -Dgallium-drivers=zink,swrast \
            -Dvulkan-drivers= \
            -Dmoltenvk-dir=${{ github.workspace }}/MoltenVK/MoltenVK \
            -Dglx=disabled \
            -Degl=disabled \
            -Dplatforms= \
            -Dshared-glapi=disabled \
            -Dosmesa=true \
            -Dllvm=disabled

      - name: Build
        run: |
          cd mesa-24.0.5/build_ios
          ninja

      - name: upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: libOSMesa-final
          path: mesa-24.0.5/build_ios/src/gallium/targets/osmesa/libOSMesa.*dylib